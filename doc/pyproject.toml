[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flyingcircus-docs"
version = "0.1.0"
description = "Flying Circus platform documentation (Zensical build)"
requires-python = ">=3.11"

dependencies = [
    "zensical>=0.0.54",
    "linkify-it-py>=2.1.0",
    "certifi>=2024.2",
    "ruamel.yaml>=0.18",
    "structlog>=24",
]

[project.entry-points."markdown.extensions"]
md_comments = "tools.md_comments:makeExtension"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-readable",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B", "TRY", "BLE", "RUF"]
# TRY003: long remediation messages in raise statements are house
# doctrine -- the messages are the documentation.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# The quality-gate feature's contract test files are an untouchable
# acceptance boundary (no edits while the gates are introduced): their
# single-block import style (I001) and two unused imports (F401,
# string-only "uses") stay frozen until those files change for their
# own sake.
"tests/test_checkout_versioned_docs.py" = ["I001"]
"tests/test_gen_changes_index.py" = ["I001"]
"tests/test_gen_platform_versions.py" = ["I001"]
"tests/test_release_notes.py" = ["I001", "F401"]
"tests/test_scaffold_page.py" = ["I001"]
"tests/test_vcs_backend.py" = ["I001", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scaffold: scaffold-tier executable specification (xfail strict until implemented)",
    "e2e: end-to-end proof against real local data (mirrors, fragments); skips loudly when the environment lacks them",
]
# make the tools/ package importable from tests (importlib import mode
# prepends nothing to sys.path; tools/ is a doc/-root package)
pythonpath = ["."]
# importlib import mode: the tiered test tree (tests/, tests/conventions/,
# tests/e2e/, tests/scaffolding/) carries no __init__.py packages, and
# importlib keeps same-basename test files across tiers distinct without
# prepending anything to sys.path.
addopts = "--import-mode=importlib"
